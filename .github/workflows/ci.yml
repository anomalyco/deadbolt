name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 5 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    if: github.event_name != 'schedule'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: Swatinem/rust-cache@v2
      - if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q libxkbcommon-dev libwayland-dev
      # Same steps as `bun run check`; cargo-deny stays in its dedicated job below.
      - run: cargo +stable fmt --all -- --check
      - run: cargo +stable clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo +stable test --workspace --locked

  # Deadbolt Send's receiver as the receive page builds it (site/scripts/wasm.sh).
  wasm:
    name: Send receiver (wasm32)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: Swatinem/rust-cache@v2
      - run: rustup target add wasm32-unknown-unknown --toolchain stable
      - run: cargo +stable clippy -p deadbolt-send -p deadbolt-send-web --target wasm32-unknown-unknown --locked -- -D warnings

  extension:
    name: Browser extension
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run build

  # Hidden and covered fields, form swaps, opaque origins, value swaps,
  # navigating mid-fill and the back/forward cache, in headless Chromium with
  # the fake host (extension/e2e). The full e2e run, with stills, stays local.
  extension-security:
    name: Browser extension security e2e
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bunx playwright-core install --with-deps chromium
      - run: bun run e2e --only security

  deny:
    name: cargo-deny
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: EmbarkStudios/cargo-deny-action@v2

  # The site depends on `knobs` via `file:../../knobs`, a checkout outside this
  # repository, so `bun install` cannot succeed in CI. Add a site job once knobs
  # is published or vendored.

  nightly:
    name: Nightly property and simulation runs
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PROPTEST_CASES: "10000"
      DEADBOLT_SIM_SEEDS: "1000"
    steps:
      - uses: actions/checkout@v6
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update -q && sudo apt-get install -y -q libxkbcommon-dev libwayland-dev
      - run: cargo test --workspace --release --locked
