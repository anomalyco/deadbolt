name: Migrate secrets check

# Temporary: proves the release environment can read the shared Homebrew tap
# key through the repo's GitHub OIDC role. Deleted once it has run.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::604439173067:role/github/deadbolt-release
          role-session-name: deadbolt-secrets-check-${{ github.run_id }}
          aws-region: us-east-1
      - uses: aws-actions/aws-secretsmanager-get-secrets@2297f9a879480a9e3af9b293ed15c70caf8e1c88 # v3.0.2
        with:
          secret-ids: |
            HOMEBREW_TAP_KEY,shared/HOMEBREW_TAP_DEPLOY_KEY
          parse-json-secrets: false
      - name: Check HOMEBREW_TAP_KEY
        run: test -n "$HOMEBREW_TAP_KEY" && echo HOMEBREW_TAP_KEY ok
