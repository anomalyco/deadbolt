name: Publish

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  select-mode:
    name: Select mode
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.changesets.outputs.mode }}
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - id: changesets
        uses: changesets/action/select-mode@v2

  version:
    name: Version packages
    if: needs.select-mode.outputs.mode == 'version'
    needs: select-mode
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - uses: changesets/action/version@v2
        with:
          script: bun run version
          pr-title: Release packages
          commit-message: Release packages

  binaries:
    name: Build ${{ matrix.platform }}
    if: needs.select-mode.outputs.mode == 'publish'
    needs: select-mode
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux-x64
            target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
          - platform: linux-arm64
            target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
          - platform: darwin-x64
            target: x86_64-apple-darwin
            runner: macos-latest
          - platform: darwin-arm64
            target: aarch64-apple-darwin
            runner: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: runner.os == 'Linux'
        run: sudo apt-get install -y musl-tools
      - run: |
          cargo build --release --locked -p deadbolt-cli --target ${{ matrix.target }}
          mkdir -p out/bin && cp target/${{ matrix.target }}/release/deadbolt out/bin/
      - name: No compromised eMudhra CA roots
        run: scripts/check-ca-roots.sh out/bin/deadbolt
      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.platform }}
          path: out
          if-no-files-found: error

  publish:
    name: Publish release
    if: needs.select-mode.outputs.mode == 'publish'
    needs: [select-mode, binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      HOMEBREW_TAP_KEY: ${{ secrets.HOMEBREW_TAP_KEY }}
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          pattern: cli-*
          path: artifacts
      - run: mv artifacts packages/cli/dist
      # A deploy key on anomalyco/homebrew-tap, under its own host alias so it never stands in for github.com.
      - name: Set up Homebrew tap SSH key
        if: env.HOMEBREW_TAP_KEY != ''
        run: |
          mkdir -p ~/.ssh
          echo "$HOMEBREW_TAP_KEY" > ~/.ssh/id_homebrew_tap
          chmod 600 ~/.ssh/id_homebrew_tap
          printf 'Host homebrew-tap.github.com\n  HostName github.com\n  User git\n  IdentityFile ~/.ssh/id_homebrew_tap\n  IdentitiesOnly yes\n' >> ~/.ssh/config
          ssh-keyscan -H github.com >> ~/.ssh/known_hosts
          git config --global user.name "deadbolt"
          git config --global user.email "deadbolt@anoma.ly"
      # release.ts creates the v<version> release; `changeset publish` then tags deadbolt@<version>, which the
      # action pushes so the next run sees this version as released. It must not make a second GitHub release.
      - uses: changesets/action/publish@v2
        with:
          script: bun run release
          create-github-releases: false
