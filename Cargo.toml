[workspace]
resolver = "3"
members = ["crates/*"]

[patch.crates-io]
# Reviewed netwatch 0.19.3 fork for upstream #261: iOS NWPathMonitor change
# events and getifaddrs snapshots, with a bounded initial asynchronous wait.
# https://github.com/n0-computer/net-tools/issues/261
# Cargo patches are global; shared interface classification was mechanically
# refactored, with non-iOS semantics reviewed rather than byte-identical files.
netwatch = { git = "https://github.com/anomalyco/net-tools", rev = "7c337433a67d6e93e88ac2037da18645e2a4019b" }

[workspace.package]
version = "0.0.0"
edition = "2024"
publish = false
license = "UNLICENSED"
rust-version = "1.91"

[workspace.lints.rust]
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
dbg_macro = "deny"
disallowed_methods = "deny"
disallowed_types = "deny"
expect_used = "warn"
let_underscore_must_use = "deny"
todo = "warn"
undocumented_unsafe_blocks = "deny"
unwrap_used = "warn"

[profile.release]
lto = true
codegen-units = 1
strip = true

# Full debuginfo was ~90% of every test binary. Line tables keep file:line in
# backtraces; for a debugger session, run with CARGO_PROFILE_DEV_DEBUG=full.
[profile.dev]
debug = "line-tables-only"

# Signatures dominate debug test time; optimize the crypto crates in dev builds.
[profile.dev.package.curve25519-dalek]
opt-level = 3

[profile.dev.package.ed25519-dalek]
opt-level = 3

[profile.dev.package.sha2]
opt-level = 3

[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
