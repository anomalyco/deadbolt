[workspace]
resolver = "3"
members = ["crates/*"]

[patch.crates-io]
# netwatch requires 0.46.x. This upstream commit still declares 0.46.3 and
# fixes iOS public-API use (IPv6 flags, SystemConfiguration and resolver DNS).
# It also includes upstream's intervening Illumos support, not a 0.47 upgrade.
# https://github.com/shellrow/netdev/commit/b3bfb0fb5595cd143bfa0b9f07d1ad6e0ef0c313
netdev = { git = "https://github.com/shellrow/netdev", rev = "b3bfb0fb5595cd143bfa0b9f07d1ad6e0ef0c313" }
# Temporary iOS-only no-event monitor for upstream #261; real interfaces still
# come from netdev. Mobile foreground/manual sync notifies iroh explicitly.
# https://github.com/n0-computer/net-tools/issues/261
# Cargo patches are global: every target uses this source, but all non-iOS
# backend implementations are unchanged from upstream netwatch 0.19.3.
netwatch = { git = "https://github.com/anomalyco/net-tools", rev = "afcef9f16519ef065ae62f7b199926b0b3d5f80e" }

[workspace.package]
version = "0.0.0"
edition = "2024"
publish = false
license = "UNLICENSED"
rust-version = "1.91"

[workspace.lints.rust]
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
dbg_macro = "deny"
disallowed_methods = "deny"
disallowed_types = "deny"
expect_used = "warn"
let_underscore_must_use = "deny"
todo = "warn"
undocumented_unsafe_blocks = "deny"
unwrap_used = "warn"

[profile.release]
lto = true
codegen-units = 1
strip = true

# Full debuginfo was ~90% of every test binary. Line tables keep file:line in
# backtraces; for a debugger session, run with CARGO_PROFILE_DEV_DEBUG=full.
[profile.dev]
debug = "line-tables-only"

# Signatures dominate debug test time; optimize the crypto crates in dev builds.
[profile.dev.package.curve25519-dalek]
opt-level = 3

[profile.dev.package.ed25519-dalek]
opt-level = 3

[profile.dev.package.sha2]
opt-level = 3

[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
