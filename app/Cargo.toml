[package]
name = "deadbolt-app"
description = "Deadbolt's desktop app: a Rune client of the running agent."
version = "0.0.0"
edition = "2024"
publish = false
license = "UNLICENSED"
rust-version = "1.91"

# Its own workspace: Rune is a git dependency that the repository's workspace
# (the CLI's --locked release builds and cargo-deny) must not need.
[workspace]

[lints.rust]
unsafe_code = "forbid"

[[bin]]
name = "deadbolt-app"
path = "src/main.rs"

[dependencies]
arboard = { version = "3.6", default-features = false, features = ["wayland-data-control"] }
deadbolt-client = { path = "../crates/client" }
rune = { git = "https://github.com/anomalyco/rune", rev = "111f9991566491035277e5a0474fd363f2d373b3" }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "111f9991566491035277e5a0474fd363f2d373b3" }
rune-theme-opencode = { git = "https://github.com/anomalyco/rune", rev = "111f9991566491035277e5a0474fd363f2d373b3" }
tokio = { version = "1.53.3", features = ["rt", "net", "io-util", "time"] }
zeroize = "1.9"

[dev-dependencies]
tempfile = "3.27.0"
