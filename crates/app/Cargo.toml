[package]
name = "deadbolt-app"
description = "Deadbolt's desktop app: a Rune client of the running agent, built into `deadbolt` (docs/app.md)."
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
rust-version.workspace = true
autotests = false

[lints]
workspace = true

[[test]]
name = "app"
path = "tests/app/main.rs"

[dependencies]
blake3 = "1.8"
deadbolt-client = { path = "../client" }
deadbolt-core = { path = "../core" }
# Rune is pinned to a rev and bumped deliberately.
rune = { git = "https://github.com/anomalyco/rune", rev = "b1457ab0d1f18cd77fa49da83155b280af2830f8", features = ["native-file-dialog", "metal-backend"] }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "b1457ab0d1f18cd77fa49da83155b280af2830f8" }
rune-theme-opencode = { git = "https://github.com/anomalyco/rune", rev = "b1457ab0d1f18cd77fa49da83155b280af2830f8" }
rustix = { version = "1.1.5", default-features = false, features = ["system", "fs", "std"] }
serde_json = "1.0.151"
sha2 = "0.11"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["rt", "net", "io-util", "macros", "sync", "time"] }
url = "2.5.8"
zeroize = "1.9"

[dev-dependencies]
tempfile = "3.27.0"
