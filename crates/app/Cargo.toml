[package]
name = "deadbolt-app"
description = "Deadbolt's desktop app: a Rune client of the running agent."
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[[bin]]
# Users only run `deadbolt`; `deadbolt app` opens this (docs/app.md).
name = "deadbolt-ui"
path = "src/main.rs"

[dependencies]
blake3 = "1.8"
deadbolt-client = { path = "../client" }
qrcode = { version = "0.14.1", default-features = false }
# Rune is pinned to a rev and bumped deliberately.
rune = { git = "https://github.com/anomalyco/rune", rev = "47c9523a5e0a77820e177ddff90a23dc1f8e94c2", features = ["native-file-dialog"] }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "47c9523a5e0a77820e177ddff90a23dc1f8e94c2" }
rune-theme-opencode = { git = "https://github.com/anomalyco/rune", rev = "47c9523a5e0a77820e177ddff90a23dc1f8e94c2" }
rustix = { version = "1.1.5", default-features = false, features = ["system", "fs", "std"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["rt", "net", "io-util", "macros", "sync", "time"] }
zeroize = "1.9"

[dev-dependencies]
tempfile = "3.27.0"
