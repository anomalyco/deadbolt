[package]
name = "deadbolt-app"
description = "Deadbolt's desktop app: a Rune client of the running daemon, built into `deadbolt` (docs/app.md)."
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
rust-version.workspace = true
autotests = false

[lints]
workspace = true

[features]
# Keycaps overlay (`--keys` / `--pointer`) in release builds (used by `scripts/hold-down.sh`).
keys-overlay = ["rune/keys-overlay"]

[[test]]
name = "app"
path = "tests/app/main.rs"

[dependencies]
blake3 = "1.8"
deadbolt-client = { path = "../client" }
deadbolt-core = { path = "../core" }
# Rune is pinned to a rev and bumped deliberately; procwatch comes from the same rev.
procwatch = { git = "https://github.com/anomalyco/rune", rev = "ac452a9c2b75c462c5eb1659024178f1fbbd416a" }
# `tooling` stays on so release scripts (`snap.sh`, `bundle.sh`, `verify-macos-release.sh`) can run `--snap` / `--list-scenes`.
rune = { git = "https://github.com/anomalyco/rune", rev = "ac452a9c2b75c462c5eb1659024178f1fbbd416a", features = ["native-file-dialog", "metal-backend", "tooling"] }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "ac452a9c2b75c462c5eb1659024178f1fbbd416a" }
rune-theme-opencode = { git = "https://github.com/anomalyco/rune", rev = "ac452a9c2b75c462c5eb1659024178f1fbbd416a" }
rustix = { version = "1.1.5", default-features = false, features = ["system", "fs", "std"] }
serde_json = "1.0.151"
sha2 = "0.11"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["rt", "net", "io-util", "macros", "sync", "time"] }
url = "2.5.8"
zeroize = "1.9"

[dev-dependencies]
tempfile = "3.27.0"
