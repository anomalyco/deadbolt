[package]
name = "deadbolt-app"
description = "Deadbolt's desktop app: a Rune client of the running agent."
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
rust-version.workspace = true
autotests = false

[lints]
workspace = true

[[bin]]
# Users only run `deadbolt`; `deadbolt app` opens this (docs/app.md).
name = "deadbolt-ui"
path = "src/main.rs"

[[test]]
name = "app"
path = "tests/app/main.rs"

[dependencies]
blake3 = "1.8"
deadbolt-client = { path = "../client" }
deadbolt-core = { path = "../core" }
# Rune is pinned to a rev and bumped deliberately.
rune = { git = "https://github.com/anomalyco/rune", rev = "1b787190b0965faa8fbd6a49fdadb1970374a765", features = ["native-file-dialog"] }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "1b787190b0965faa8fbd6a49fdadb1970374a765" }
rune-theme-opencode = { git = "https://github.com/anomalyco/rune", rev = "1b787190b0965faa8fbd6a49fdadb1970374a765" }
rustix = { version = "1.1.5", default-features = false, features = ["system", "fs", "std"] }
serde_json = "1.0.151"
sha2 = "0.11"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["rt", "net", "io-util", "macros", "sync", "time"] }
url = "2.5.8"
zeroize = "1.9"

[build-dependencies]
sha2 = "0.11"

[dev-dependencies]
tempfile = "3.27.0"
