[package]
name = "deadbolt-app"
description = "Deadbolt's desktop app: a Rune client of the running agent."
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[[bin]]
name = "deadbolt-app"
path = "src/main.rs"

[dependencies]
blake3 = "1.8"
deadbolt-client = { path = "../client" }
qrcode = { version = "0.14.1", default-features = false }
# Rune is pinned to a rev and bumped deliberately.
rune = { git = "https://github.com/anomalyco/rune", rev = "b700fe8bb235ff035d4856612ba5975790f7865a", features = ["native-file-dialog"] }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "b700fe8bb235ff035d4856612ba5975790f7865a" }
rune-theme-opencode = { git = "https://github.com/anomalyco/rune", rev = "b700fe8bb235ff035d4856612ba5975790f7865a" }
rustix = { version = "1.1.5", default-features = false, features = ["system", "fs", "std"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["rt", "net", "io-util", "macros", "sync", "time"] }
zeroize = "1.9"

[dev-dependencies]
tempfile = "3.27.0"
