# Shared negatives: autocomplete tokens that say "this is not a login field".
# A trailing * matches any token with that prefix. Included by every field type.

name = "non-login-autocomplete"

[[autocomplete]]
token = "name"
score = -6
why = "Ported from clues.ts: an identity, address, payment or profile token"

