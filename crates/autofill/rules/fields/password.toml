# The current password of a login (FieldRole "password").
#
# Clue scores add up per field; see crates/autofill/README.md.

type = "password"
include = ["non-login-autocomplete"]

[[autocomplete]]
token = "current-password"
score = 10
why = "The site declares the field the current password"

[[autocomplete]]
token = "new-password"
score = -4
why = "The site declares a fresh password"

[[element]]
element = "password"
score = 4
why = "A bare password box is most often a sign-in"

[[element]]
element = "*"
score = -6
why = "Text boxes rarely hold passwords, but some are plain text boxes named and labelled Password that a script masks (internet-banking.dbs.bank.in, npfonline.com); strong wording can outvote this"

