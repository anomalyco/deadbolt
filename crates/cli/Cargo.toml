[package]
name = "deadbolt-cli"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[[bin]]
name = "deadbolt"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
blake3 = { version = "1.8", features = ["zeroize"] }
clap = { version = "4.6.7", features = ["derive"] }
data-encoding = "2.11.1"
getrandom = "0.4"
indexmap = "2.14"
deadbolt-client = { path = "../client" }
deadbolt-core = { path = "../core" }
deadbolt-net = { path = "../net", features = ["application"] }
deadbolt-send = { path = "../send" }
deadbolt-store = { path = "../store" }
rpassword = "7.5.4"
rustix = { version = "1.1.5", default-features = false, features = ["process", "system"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sigpipe = "0.1.3"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "signal", "process"] }
toml = "1.1.6"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
zeroize = "1.9"
csv = "1.4"
crypto-bigint = { version = "0.7", default-features = false, features = ["alloc", "zeroize"] }
der = { version = "0.8", default-features = false, features = ["pem", "std"] }
ed25519-dalek = { version = "3.0", features = ["pkcs8"] }
hmac = "0.13.0"
p256 = { version = "0.14", features = ["ecdsa", "pkcs8", "pem", "getrandom"] }
p384 = { version = "0.14", features = ["ecdsa", "pkcs8", "pem"] }
p521 = { version = "0.14", features = ["ecdsa", "pkcs8", "pem"] }
pkcs8 = { version = "0.11", default-features = false, features = ["pem", "encryption", "std"] }
ring = "0.17"
sha1 = { version = "0.11.0", default-features = false }
ssh-key = { version = "0.7.0-rc.11", features = ["std", "ed25519", "p256", "p384", "p521", "encryption", "getrandom"] }
url = "2.5.8"
sha2 = "0.11"
# `deadbolt update`: both are already in the tree through iroh, with ring.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tempfile = "3.27.0"
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
zip = { version = "9.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
redb = "4"
deadbolt-net = { path = "../net", features = ["sim"] }
proptest = "1.9"
tokio = { version = "1.53.3", features = ["test-util"] }
memchr = "2.8"
