[package]
name = "deadbolt-cli"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[[bin]]
name = "deadbolt"
path = "src/main.rs"

[features]
default = ["v1-migrate"]
# DELETABLE(v1-migrate): remove once existing v1 users have migrated to v2,
# with src/daemon/migrate_v1.rs, src/daemon/migrate_v1/, src/daemon/upgrade.rs,
# src/migrate.rs and tests/cli/migrate_v1.rs.
# `deadbolt migrate`: reads a v1 store.redb and moves its vaults to v2.
v1-migrate = ["dep:redb", "dep:chacha20poly1305"]

[dependencies]
anyhow = "1.0.104"
argon2 = { version = "0.6", default-features = false, features = ["zeroize"] }
blake3 = { version = "1.8", features = ["zeroize"] }
thiserror = "2.0"
clap = { version = "4.6.7", features = ["derive"] }
data-encoding = "2.11.1"
getrandom = "0.4"
indexmap = "2.14"
deadbolt-client = { path = "../client" }
deadbolt-core = { path = "../core" }
deadbolt-proto = { path = "../proto" }
deadbolt-enclave = { path = "../enclave" }
deadbolt-engine = { path = "../engine" }
deadbolt-net = { path = "../net", features = ["application"] }
deadbolt-os = { path = "../os" }
deadbolt-pack = { path = "../pack" }
# `deadbolt broker` re-signs AWS requests with its pure SigV4; `deadbolt
# remote` syncs a vault through S3/R2 or WebDAV.
deadbolt-remote = { path = "../remote" }
deadbolt-send = { path = "../send" }
# Lays checkpoint packs out as the viewer reads them; no UniFFI.
deadbolt-viewer = { path = "../viewer", default-features = false }
# `deadbolt broker`'s HTTP/1 server; all three are already in the tree through reqwest.
http-body-util = "0.1.5"
hyper = { version = "1.12", features = ["http1", "server"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
rpassword = "7.5.4"
rustix = { version = "1.1.5", default-features = false, features = ["process", "stdio", "system"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sigpipe = "0.1.3"
subtle = "2.6"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "signal", "process"] }
toml = "1.1.6"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
zeroize = { version = "1.9", features = ["serde"] }
csv = "1.4"
# Its own memory and CPU (the daemon), and a counting allocator in dev builds.
procwatch = { git = "https://github.com/anomalyco/rune", rev = "ac452a9c2b75c462c5eb1659024178f1fbbd416a" }
url = "2.5.8"
sha2 = "0.11"
# `deadbolt update`: both are already in the tree through iroh, with ring.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tempfile = "3.27.0"
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
zip = { version = "9.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }
# DELETABLE(v1-migrate): the v1 store.redb's database and record cipher.
redb = { version = "4.4", optional = true }
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc", "zeroize"], optional = true }

[dev-dependencies]
p256 = { version = "0.14", features = ["ecdsa", "pkcs8"] }
deadbolt-core = { path = "../core", features = ["sim"] }
deadbolt-net = { path = "../net", features = ["sim"] }
tokio = { version = "1.53.3", features = ["test-util"] }
memchr = "2.8"
# DELETABLE(v1-migrate): signs the v1 entries of the store.redb test fixture.
ed25519-dalek = "3.0"
