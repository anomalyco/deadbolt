[package]
name = "deadbolt-client"
description = "The agent's control protocol, its file locations, and a client that starts and talks to it."
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
deadbolt-core = { path = "../core" }
blake3 = "1.8"
data-encoding = "2.11.1"
nix = { version = "0.31", default-features = false, features = ["socket"] }
rustix = { version = "1.1.5", default-features = false, features = ["fs", "process", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["net", "io-util", "macros", "rt", "time"] }
zeroize = { version = "1.9", features = ["derive", "serde"] }
zip = { version = "9.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
tokio = { version = "1.53.3", features = ["rt"] }
