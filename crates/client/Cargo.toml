[package]
name = "deadbolt-client"
description = "The daemon's file locations, and a client that starts and talks to it over the control protocol (deadbolt-proto)."
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
default = ["host"]
# Full daemon client: async socket transport, paths, export, file fields,
# and OTLP telemetry. Disabled by sandboxed extensions (deadbolt-ffi) that
# only verify the daemon's peer signature and frame JSON lines.
host = [
    "dep:blake3",
    "dep:tempfile",
    "dep:thiserror",
    "dep:tokio",
    "dep:zip",
    "rustix/fs",
    "serde/derive",
]

[dependencies]
data-encoding = "2.11.1"
deadbolt-proto = { path = "../proto" }
rustix = { version = "1.1.5", default-features = false, features = ["process", "std"] }
serde = "1.0.229"
serde_json = "1.0.151"
zeroize = "1.9"

blake3 = { version = "1.8", optional = true }
tempfile = { version = "3.27.0", optional = true }
thiserror = { version = "2.0.21", optional = true }
tokio = { version = "1.53.3", features = ["net", "io-util", "macros", "rt", "time"], optional = true }
zip = { version = "9.1", default-features = false, features = ["deflate-flate2-zlib-rs"], optional = true }

[target.'cfg(unix)'.dependencies]
deadbolt-os = { path = "../os" }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
security-framework = "3.7"

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.53.3", features = ["rt"] }
