[package]
name = "deadbolt-client"
description = "The agent's control protocol, its file locations, and a client that starts and talks to it."
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
blake3 = "1.8"
rustix = { version = "1.1.5", default-features = false, features = ["process"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["net", "io-util", "time"] }
zeroize = { version = "1.9", features = ["serde"] }
