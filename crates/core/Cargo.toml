[package]
name = "deadbolt-core"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
default = ["health"]
health = ["dep:zxcvbn"]
# A per-thread seeded random stream for the CLI's deterministic simulator.
# Inert until a thread is seeded; never seed one outside tests.
sim = []

[dependencies]
blake3 = { version = "1.8", features = ["zeroize"] }
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc", "zeroize"] }
data-encoding = "2.11.1"
ed25519-dalek = "3.0"
subtle = "2.6"
x25519-dalek = { version = "3.0.0", default-features = false, features = ["precomputed-tables", "static_secrets", "zeroize"] }
getrandom = "0.4"
hmac = "0.13.0"
sha1 = { version = "0.11.0", default-features = false }
sha2 = { version = "0.11.1", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
psl = "2.1.245"
p256 = { version = "0.14", features = ["ecdsa", "pkcs8", "getrandom"] }
url = "2.5.8"
thiserror = "2.0"
zeroize = "1.9"
zxcvbn = { version = "3.1.1", default-features = false, optional = true }

[dev-dependencies]
proptest = "1.9"
