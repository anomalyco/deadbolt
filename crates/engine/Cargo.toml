[package]
name = "deadbolt-engine"
description = "Deadbolt's vault engine: the unlocked vaults and the item, autofill, form, passkey, secret, SSH key and Activity rules the daemon serves them by. Sans-IO: storage and time come from the host, and it builds for wasm32-unknown-unknown."
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = "1.0.104"
data-encoding = "2.11.1"
deadbolt-core = { path = "../core" }
deadbolt-proto = { path = "../proto" }
der = { version = "0.8", default-features = false, features = ["pem", "std"] }
ed25519-dalek = { version = "3.0", features = ["pkcs8"] }
getrandom = "0.4"
indexmap = "2.14"
p256 = { version = "0.14", features = ["ecdsa", "pkcs8", "pem", "getrandom"] }
p384 = { version = "0.14", features = ["ecdsa", "pkcs8", "pem"] }
p521 = { version = "0.14", features = ["ecdsa", "pkcs8", "pem"] }
pkcs8 = { version = "0.11", default-features = false, features = ["pem", "encryption", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
ssh-key = { version = "0.7.0-rc.11", features = ["std", "ed25519", "p256", "p384", "p521", "encryption", "getrandom"] }
subtle = "2.6"
tracing = "0.1.44"
zeroize = "1.9"

[dev-dependencies]
ed25519-dalek = { version = "3.0", features = ["pkcs8", "pem"] }
tempfile = "3.27.0"

# Key generation draws from the browser's crypto in a wasm32 host.
[target.'cfg(all(target_family = "wasm", target_os = "unknown"))'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }
