[package]
name = "deadbolt-ext-core"
description = "Standalone extension device: the Rust vault, encrypted store and iroh sync in a browser worker."
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[target.'cfg(all(target_family = "wasm", target_os = "unknown"))'.dependencies]
deadbolt-core = { path = "../core" }
deadbolt-store = { path = "../store" }
deadbolt-net = { path = "../net", features = ["application"] }
data-encoding = "2.11.1"
getrandom = { version = "0.4", features = ["wasm_js"] }
n0-future = "0.3.2"
redb = "4"
tokio = { version = "1.53.3", features = ["sync", "macros"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
serde-wasm-bindgen = "0.6"
thiserror = "2"
url = "2"
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4.79"
zeroize = "1.9"
