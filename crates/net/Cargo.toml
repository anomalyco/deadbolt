[package]
name = "deadbolt-net"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
rust-version.workspace = true
autotests = false

[lints]
workspace = true

[[test]]
name = "net"
path = "tests/net/main.rs"

[features]
# Exposes transport bypasses for deterministic simulations, never needed by the CLI runtime.
sim = []

[dependencies]
data-encoding = "2.11.1"
getrandom = "0.4"
hmac = "0.13.0"
iroh = "1.3.0"
qrcode = { version = "0.14.1", default-features = false }
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["full"] }
tracing = "0.1.44"
zeroize = "1.9"
