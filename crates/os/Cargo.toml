[package]
name = "deadbolt-os"
description = "Safe wrappers for the few OS calls no dependency wraps: a process's BSD facts and arguments, code signing information, process hardening and locked key memory. The one crate where `unsafe` is allowed."
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
rust-version.workspace = true

# Not `[lints] workspace = true`: the workspace forbids `unsafe`, and this crate
# holds Deadbolt's FFI. It denies `unsafe` too, allowing it only in the modules
# that need it, every block with a SAFETY comment. Otherwise these are the
# workspace's shared lints; keep them in step with the root Cargo.toml.
[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[lints.clippy]
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
dbg_macro = "deny"
disallowed_methods = "deny"
disallowed_types = "deny"
expect_used = "warn"
let_underscore_must_use = "deny"
multiple_unsafe_ops_per_block = "deny"
todo = "warn"
undocumented_unsafe_blocks = "deny"
unwrap_used = "warn"

[target.'cfg(unix)'.dependencies]
libc = "0.2.190"
zeroize = "1"

# Linux: the exact NETLINK_SOCK_DIAG socket lookup (`net`), without `unsafe`.
[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1.1.5", default-features = false, features = ["net", "std"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
security-framework = "3.7"
security-framework-sys = "2.17"

[dev-dependencies]
tempfile = "3.27.0"
