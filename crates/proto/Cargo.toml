[package]
name = "deadbolt-proto"
description = "Deadbolt's wire schemas: the daemon's control protocol and the browser extension's native messaging protocol, with their TypeScript bindings."
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
deadbolt-core = { path = "../core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
ts-rs = "12.0.1"
zeroize = { version = "1.9", features = ["derive", "serde"] }
