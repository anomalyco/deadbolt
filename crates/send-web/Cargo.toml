[package]
name = "deadbolt-send-web"
description = "The browser side of Deadbolt Send: deadbolt-send's receiver compiled to WebAssembly for the receive page."
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

# Only built for the browser (`site/scripts/wasm.sh`); empty elsewhere.
[target.'cfg(all(target_family = "wasm", target_os = "unknown"))'.dependencies]
deadbolt-send = { path = "../send", features = ["serde"] }
js-sys = "0.3.106"
serde = { version = "1.0.229", features = ["derive"] }
serde-wasm-bindgen = "0.6"
# Pinned: the site's build runs the wasm-bindgen CLI of exactly this version.
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4.79"
