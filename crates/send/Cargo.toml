[package]
name = "deadbolt-send"
description = "Deadbolt Send: links that hand a sealed bundle to a browser, live over iroh or from the vault's remote store."
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
default = ["live"]
# The live iroh transport: Server, receive and SendTicket. Without it the crate
# is the sealed format and bundles only (store-backed Send in deadbolt-remote).
live = [
  "dep:data-encoding",
  "dep:hmac",
  "dep:iroh",
  "dep:n0-future",
  "dep:sha2",
  "dep:tokio",
  "dep:tracing",
]
# Serialize bundles (for the browser receiver's JavaScript objects).
serde = ["dep:serde", "dep:serde_bytes"]

[dependencies]
blake3 = { version = "1.8", features = ["zeroize"] }
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc", "zeroize"] }
data-encoding = { version = "2.11.1", optional = true }
getrandom = "0.4"
hmac = { version = "0.13.0", optional = true }
iroh = { version = "1.3.0", default-features = false, features = ["tls-ring"], optional = true }
n0-future = { version = "0.3.2", optional = true }
serde = { version = "1.0.229", features = ["derive"], optional = true }
serde_bytes = { version = "0.11", optional = true }
sha2 = { version = "0.11.1", optional = true }
thiserror = "2.0.21"
tracing = { version = "0.1.44", optional = true }
zeroize = { version = "1.9", features = ["derive"] }

[target.'cfg(not(all(target_family = "wasm", target_os = "unknown")))'.dependencies]
tokio = { version = "1.53.3", features = ["rt", "sync", "time", "macros"], optional = true }

[target.'cfg(all(target_family = "wasm", target_os = "unknown"))'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }

[dev-dependencies]
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "test-util"] }
