[package]
name = "deadbolt-send"
description = "Deadbolt Send: one-time links that hand a sealed bundle to a browser, live over iroh."
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
# Serialize bundles (for the browser receiver's JavaScript objects).
serde = ["dep:serde", "dep:serde_bytes"]

[dependencies]
blake3 = { version = "1.8", features = ["zeroize"] }
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc", "zeroize"] }
data-encoding = "2.11.1"
getrandom = "0.4"
hmac = "0.13.0"
iroh = { version = "1.3.0", default-features = false, features = ["tls-ring"] }
n0-future = "0.3.2"
serde = { version = "1.0.229", features = ["derive"], optional = true }
serde_bytes = { version = "0.11", optional = true }
sha2 = "0.11.1"
thiserror = "2.0.21"
tracing = "0.1.44"
zeroize = { version = "1.9", features = ["derive"] }

[target.'cfg(not(all(target_family = "wasm", target_os = "unknown")))'.dependencies]
tokio = { version = "1.53.3", features = ["rt", "sync", "time", "macros"] }

[target.'cfg(all(target_family = "wasm", target_os = "unknown"))'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }

[dev-dependencies]
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "test-util"] }
