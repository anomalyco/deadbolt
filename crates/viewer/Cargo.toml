[package]
name = "deadbolt-viewer"
description = "Deadbolt v2's read-only viewer for mobile AutoFill extensions: fills straight from one gen-<n>.pack with pack-scoped keys (never K_e or D_sign), and seals offline saves to the app's D_kem in outbox/. No KDF, no tokio, no network."
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
# The static library links into the iOS Credential Provider extension; the
# rlib serves the foreground app's repacker, tests and Clippy.
crate-type = ["staticlib", "rlib"]

[lints]
workspace = true

[features]
default = ["ffi"]
# The UniFFI surface (`ViewerHandle` and friends) for Swift and Kotlin.
ffi = ["dep:uniffi"]

[dependencies]
# No `health`: zxcvbn has no place in an extension.
deadbolt-core = { path = "../core", default-features = false }
deadbolt-pack = { path = "../pack" }
getrandom = "0.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0"
# Same version as deadbolt-ffi: one UniFFI generator for every Swift binding.
uniffi = { version = "=0.32.2", optional = true }
zeroize = { version = "1.9", features = ["serde"] }

[dev-dependencies]
tempfile = "3.27.0"
