[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    { id = "RUSTSEC-2024-0436", reason = "paste is unmaintained but only reachable through iroh; no replacement available" },
    { id = "RUSTSEC-2026-0374", reason = "basic-toml is unmaintained; required by Askama in UniFFI's optional host-side binding generator, absent from the mobile runtime graph. Latest UniFFI 0.32.2/Askama 0.16.1 still require it; remove when upstream replaces it." },
]

[licenses]
version = 2
allow = [
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
    "https://github.com/anomalyco/rune",
    # Exact netdev 0.46.3 iOS fix rev is pinned in Cargo.toml.
    "https://github.com/shellrow/netdev",
    # Exact temporary iOS-only netwatch stub rev is pinned in Cargo.toml.
    "https://github.com/anomalyco/net-tools",
]
