[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    { id = "RUSTSEC-2024-0436", reason = "paste is unmaintained but only reachable through iroh; no replacement available" },
    { id = "RUSTSEC-2026-0370", reason = "zvariant: Linux-only, through Rune's zbus 5; drop when Rune moves to zbus 6" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names: Linux-only, through Rune's zbus 5; drop when Rune moves to zbus 6" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive: Linux-only, through Rune's zbus 5; drop when Rune moves to zbus 6" },
]

[licenses]
version = 2
allow = [
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = ["https://github.com/anomalyco/rune"]
